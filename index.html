<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tree.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Linda Schönfeldt is a UX-minded frontend developer in Stockholm, building accessible, user-focused interfaces in React and TypeScript."
    />
    <meta
      property="og:title"
      content="Linda Schönfeldt | Frontend Developer & UX Designer"
    />
    <meta
      property="og:description"
      content="Linda Schönfeldt is a UX-minded frontend developer in Stockholm, building accessible, user-focused interfaces in React and TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lindaschonfeldt.com/" />
    <meta property="og:image" content="https://lindaschonfeldt.com/images/linda.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="Portrait of Linda Schönfeldt" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.emailjs.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />

    <!-- Preconnect for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Linda Schönfeldt | Frontend Developer & UX Designer</title>

    <!-- Load fonts asynchronously -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Jost:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Jost:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div
      id="splash"
      style="
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998;
      "
    >
      <img src="/tree.svg" alt="" style="width: 6rem; height: auto" />
    </div>
    <script>
      (function () {
        var seen = false
        try { seen = sessionStorage.getItem('introSeen') === '1' } catch (e) {}
        if (window.location.pathname !== '/' || seen) {
          document.getElementById('splash').style.display = 'none'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
